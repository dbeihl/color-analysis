name: Commit identity guard

# Only pull requests are checked, because that is where the protection lives. Branch
# protection on main requires a pull request, admins included, so main is unreachable
# without one. This depends on that branch protection staying in force.
on:
  pull_request:

jobs:
  check-identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check author and committer email on every commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ALLOWED="51423378+dbeihl@users.noreply.github.com"
          OWNER="${{ github.event.pull_request.head.repo.owner.login }}"
          FAILED=0
          LOGINS=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" --jq '.[] | "\(.sha) \(.author.login // "-") \(.committer.login // "-")"')

          for sha in $(git rev-list "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"); do
            if [ "$OWNER" != "dbeihl" ] && grep -qxE "$sha $OWNER ($OWNER|web-flow)" <<< "$LOGINS"; then
              continue
            fi
            author_email=$(git log -1 --format='%ae' "$sha")
            committer_email=$(git log -1 --format='%ce' "$sha")
            if [ "$author_email" != "$ALLOWED" ]; then
              echo "Commit $sha has author email '$author_email', expected '$ALLOWED'"
              FAILED=1
            fi
            parents=$(git log -1 --format='%P' "$sha")
            if [ "$committer_email" != "$ALLOWED" ] && ! { [ "$committer_email" = "noreply@github.com" ] && [[ "$parents" = *" "* ]]; }; then
              echo "Commit $sha has committer email '$committer_email', expected '$ALLOWED'"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "Commits in a pull request from a fork pass when GitHub links their author and committer to the fork owner's account. See CONTRIBUTING.md."
            exit 1
          fi

      - name: Prove identity guard accepts and rejects the right commits
        run: node scripts/test-commit-identity.mjs
