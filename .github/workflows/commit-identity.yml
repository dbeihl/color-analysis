name: Commit identity guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deliberately a denylist of one hazard, the maintainer's work domain, not an identity allowlist:
      # contributors and the maintainer may commit with any other address, and nothing checks GitHub
      # account links. scripts/test-commit-identity.mjs pins the accepted and rejected cases.
      - name: Reject author and committer emails at the maintainer's work domain
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -e
          shopt -s nocasematch
          WORK_DOMAIN="utilicast.com"
          FAILED=0

          at_work_domain() {
            case "$1" in
              *@"$WORK_DOMAIN"|*@*."$WORK_DOMAIN") return 0 ;;
            esac
            return 1
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git rev-list "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}")
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable 'before' commit (first push or force-push); checking only the pushed commit."
            COMMITS=$(git rev-list -1 "$AFTER")
          else
            COMMITS=$(git rev-list "$BEFORE..$AFTER")
          fi

          for sha in $COMMITS; do
            author_email=$(git log -1 --format='%ae' "$sha")
            committer_email=$(git log -1 --format='%ce' "$sha")
            if at_work_domain "$author_email"; then
              echo "Commit $sha has author email '$author_email' at the maintainer's work domain $WORK_DOMAIN"
              FAILED=1
            fi
            if at_work_domain "$committer_email"; then
              echo "Commit $sha has committer email '$committer_email' at the maintainer's work domain $WORK_DOMAIN"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Prove identity guard accepts and rejects the right commits
        run: node scripts/test-commit-identity.mjs
