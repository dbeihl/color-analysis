name: Commit identity guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check author and committer email on every commit
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -e
          ALLOWED="51423378+dbeihl@users.noreply.github.com"
          FAILED=0

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git rev-list "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}")
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable 'before' commit (first push or force-push); checking only the pushed commit."
            COMMITS=$(git rev-list -1 "$AFTER")
          else
            COMMITS=$(git rev-list "$BEFORE..$AFTER")
          fi

          for sha in $COMMITS; do
            author_email=$(git log -1 --format='%ae' "$sha")
            committer_email=$(git log -1 --format='%ce' "$sha")
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ] && [ "${{ github.event.pull_request.user.login }}" != "dbeihl" ]; then
              continue
            fi
            if [ "$author_email" != "$ALLOWED" ]; then
              echo "Commit $sha has author email '$author_email', expected '$ALLOWED'"
              FAILED=1
            fi
            parents=$(git log -1 --format='%P' "$sha")
            if [ "$committer_email" != "$ALLOWED" ] && ! { [ "$committer_email" = "noreply@github.com" ] && [[ "$parents" = *" "* ]]; }; then
              echo "Commit $sha has committer email '$committer_email', expected '$ALLOWED'"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Prove identity guard accepts and rejects the right commits
        run: node scripts/test-commit-identity.mjs
